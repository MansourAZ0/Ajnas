[package]
name = "ajnas"
version = "0.2.0"
description = "Ajnas: a local-first oud performance and learning companion"
authors = ["Mansour Aziz"]
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ajnas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
naghma-core = { git = "https://github.com/MansourAZ0/naghma-core", tag = "v0.5.0" }
naghma-audio = { git = "https://github.com/MansourAZ0/naghma-core", tag = "v0.5.0" }

[dev-dependencies]
pitchforge = { git = "https://github.com/MansourAZ0/pitchforge-rs", tag = "v0.1.0", features = ["signals"] }

[profile.dev]
debug = false
incremental = false

[profile.dev.package."*"]
debug = false


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
